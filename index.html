<script>
    let chartInstances = {};

    function renderDetailChart(canvasId, chartData, color='#ef4444') {
        if (!chartData || !Array.isArray(chartData) || chartData.length === 0) return;
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

        // 過濾掉數據中的 NaN
        const cleanData = chartData.filter(d => d && !isNaN(d.price) && d.price !== null);
        if (cleanData.length === 0) return;

        const bgAlpha = color === '#ef4444' ? 'rgba(239, 68, 68, 0.12)' : (color === '#00e676' ? 'rgba(0, 230, 118, 0.12)' : 'rgba(234, 179, 8, 0.12)');

        chartInstances[canvasId] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: cleanData.map(d => d.time),
                datasets: [{
                    data: cleanData.map(d => d.price),
                    borderColor: color,
                    borderWidth: 1.5,
                    fill: true,
                    backgroundColor: bgAlpha,
                    pointRadius: 1.5,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#64748b', font: { size: 8 }, maxTicksLimit: 5 }, grid: { display: false } },
                    y: { ticks: { color: '#64748b', font: { size: 8 } }, grid: { color: '#111827' } }
                }
            }
        });
    }

    async function loadData() {
        try {
            // 加入快取消除機制，並用 text() 處理無效的 JSON 格式
            const res = await fetch('data.json?v=' + new Date().getTime());
            let textData = await res.text();
            
            // 強制在前端將 JSON 內殘留的 NaN / nan 替換為安全字串，防止 JSON.parse 報錯
            textData = textData.replace(/:\s*NaN/g, ': null').replace(/:\s*"nan"/g, ': "--"');
            
            const data = JSON.parse(textData);

            // 1. 更新頂部時間
            if (data.updated_at) {
                document.getElementById('updateTime').innerText = `更新時間：${data.updated_at}`;

                const rawDateStr = data.updated_at.split(' ')[0];
                const datePart = rawDateStr.replace(/-/g, '/');
                const d = new Date(rawDateStr);
                const dayMap = ['日', '一', '二', '三', '四', '五', '六'];
                const dayName = isNaN(d.getDay()) ? '' : ` (${dayMap[d.getDay()]})`;

                document.getElementById('todayBadge').innerText = `📅 ${datePart}${dayName}`;
            }

            // 2. 渲染頂部/焦點大卡片
            const renderTopCard = (id, item) => {
                if (!item || item.price === '--' || item.price === 'nan') return;
                document.getElementById(`${id}-price`).innerText = item.price;
                if(item.prev_close) document.getElementById(`${id}-prev`).innerText = item.prev_close;
                
                const weekEl = document.getElementById(`${id}-week`);
                if (weekEl && item.week_pChange) {
                    weekEl.innerText = item.week_pChange;
                    const isUp = item.week_pChange.includes('+');
                    weekEl.className = isUp ? 'red' : 'green';
                }
            };

            renderTopCard('twii', data.twii);
            renderTopCard('tsmc', data.tsmc);
            renderTopCard('etf6208', data.etf6208);

            // 3. 渲染一般漲跌卡片
            const renderCard = (id, item, forceRed = false) => {
                if (!item || item.price === '--' || item.price === 'nan') return;
                const priceEl = document.getElementById(`${id}-price`);
                const changeEl = document.getElementById(`${id}-change`);
                
                if (priceEl) {
                    priceEl.innerText = item.price;
                    const isUp = (item.raw_change || 0) > 0;
                    const colorClass = forceRed ? 'red' : (isUp ? 'red' : 'green');
                    priceEl.className = `${priceEl.className.replace(/red|green/g, '')} ${colorClass}`;
                }

                if (changeEl && item.change) {
                    const isUp = (item.raw_change || 0) > 0;
                    const colorClass = forceRed ? 'red' : (isUp ? 'red' : 'green');
                    const arrow = (isUp || forceRed) ? '▲' : '▼';
                    changeEl.innerText = `${arrow} ${String(item.change).replace(/[+-]/g, '')} (${item.pChange || ''})`;
                    changeEl.className = `${changeEl.className.replace(/red|green/g, '')} ${colorClass}`;
                }
            };

            ['dji', 'ixic', 'sox', 'vix', 'brent', 'fitx'].forEach(k => renderCard(k, data[k]));
            renderCard('usdtwd', data.usdtwd, true);

            // 4. 動態更新 VIX 的開高低收細節
            if (data.vix) {
                document.getElementById('vix-open').innerText = data.vix.open ?? '--';
                document.getElementById('vix-high').innerText = data.vix.high ?? '--';
                document.getElementById('vix-low').innerText = data.vix.low ?? '--';
                document.getElementById('vix-prev').innerText = data.vix.prev ?? '--';
            }

            // 5. 動態更新 美國10年期公債殖利率
            if (data.bond) {
                document.getElementById('bond-price').innerText = `${data.bond.price} %`;
                document.getElementById('bond-prev').innerText = `${data.bond.prev_close} %`;
            }

            // 6. 動態渲染 資券進出行情表格
            if (data.margin_data && data.margin_data.length > 0) {
                const tbody = document.getElementById('margin-tbody');
                if (tbody) {
                    tbody.innerHTML = '';
                    data.margin_data.forEach(row => {
                        const marginClass = strHasMinus(row.margin_buy_sell) ? 'green' : 'red';
                        const shortClass = strHasMinus(row.short_buy_sell) ? 'green' : 'red';
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.date}</td>
                            <td class="${marginClass}">${row.margin_buy_sell}</td>
                            <td class="${shortClass}">${row.short_buy_sell}</td>
                            <td style="color:#fff">${row.margin_balance}</td>
                            <td style="color:#fff">${row.short_balance}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            // 7. 恐懼與貪婪指數繪製
            if (data.fear) {
                const score = parseInt(data.fear.score) || 38;
                document.getElementById('fear-score').innerText = score;
                const angle = (score / 100) * Math.PI;
                document.getElementById('needle').setAttribute('x2', (50 - 32 * Math.cos(angle)).toFixed(1));
                document.getElementById('needle').setAttribute('y2', (50 - 32 * Math.sin(angle)).toFixed(1));
            }

            // 8. 折線圖渲染
            if (data.charts) {
                renderDetailChart('chart-twii', data.charts.twii, (data.twii?.raw_change || 0) >= 0 ? '#ef4444' : '#00e676');
                renderDetailChart('chart-fitx', data.charts.twii, (data.fitx?.raw_change || 0) >= 0 ? '#ef4444' : '#00e676');
                renderDetailChart('chart-tsmc', data.charts.tsmc, (data.tsmc?.raw_change || 0) >= 0 ? '#ef4444' : '#00e676');
                renderDetailChart('chart-etf6208', data.charts.etf6208, (data.etf6208?.raw_change || 0) >= 0 ? '#ef4444' : '#00e676');
                
                if (data.charts.twd) {
                    renderDetailChart('twdCanvas', data.charts.twd, '#eab308');
                }
                if (data.charts.brent) {
                    renderDetailChart('brentCanvas', data.charts.brent, (data.brent?.raw_change || 0) >= 0 ? '#ef4444' : '#00e676');
                }
            }

        } catch (e) {
            console.error("解析與同步失敗:", e);
        }
    }

    function strHasMinus(val) {
        return String(val).includes('-');
    }

    loadData();
</script>
