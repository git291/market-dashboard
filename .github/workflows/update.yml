name: Daily Market Scraper

on:
  schedule:
    - cron: '0 22 * * *'  # 每日 06:00 AM (Taiwan)
  workflow_dispatch:

# 顯式宣告 GitHub Actions 的寫入權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # 升級至 v4 解決 Node.js 警告

      - name: Set up Python
        uses: actions/setup-python@v5  # 升級至 v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Fetch Market Data
        run: python update_data.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto Update Market Data" || echo "No changes to commit"
          git push
